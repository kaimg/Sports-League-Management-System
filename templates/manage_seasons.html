{% extends "layout.html" %}
{% block title %}Manage Seasons - Admin Panel{% endblock %}
{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Manage Seasons</h1>
    <div class="row">
        <div class="col-md-6">
            <h2 id="form-title">Add Season</h2>
            <form action="{{ url_for('admin.manage_seasons') }}" method="POST" id="seasonForm">
                <input type="hidden" id="season_id" name="season_id">
                <div class="form-group">
                    <label for="league_id">League:</label>
                    <select class="form-control" id="league_id" name="league_id" required>
                        <option value="">Select league</option>
                        {% for league in leagues %}
                            <option value="{{ league[0] }}">{{ league[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="year">Year:</label>
                    <input
                        type="text"
                        class="form-control"
                        id="year"
                        name="year"
                        placeholder="Example: 2025-2026"
                        required>
                </div>
                <button type="submit" name="submit" class="btn btn-primary" id="submit-button">
                    Add Season
                </button>
            </form>
        </div>
        <div class="col-md-6">
            <h2>Existing Seasons</h2>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>League</th>
                        <th>Year</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody>
                    {% for season in seasons %}
                    <tr>
                        <td>{{ season[0] }}</td>
                        <td>{{ season[3] }}</td>
                        <td>{{ season[2] }}</td>
                        <td>
                            <button
                                type="button"
                                class="btn btn-success btn-sm edit-season-btn"
                                data-id="{{ season[0] }}"
                                data-league-id="{{ season[1] }}"
                                data-year="{{ season[2] }}">
                                <i class="fa fa-pencil-alt"></i>
                            </button>
                        </td>
                        <td>
    <form
        action="{{ url_for('admin.manage_seasons') }}"
        method="POST"
        style="display:inline;"
        onsubmit="return confirm('Are you sure you want to delete this season?');">

        <input type="hidden" name="deleteItemId" value="{{ season[0] }}">

        <button type="submit" name="delete" class="btn btn-danger btn-sm">
            <i class="fa fa-minus"></i>
        </button>
    </form>
</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>



<script>
    document.querySelectorAll('.edit-season-btn').forEach(function(button) {
        button.addEventListener('click', function() {
            const id = this.getAttribute('data-id');
            const leagueId = this.getAttribute('data-league-id');
            const year = this.getAttribute('data-year');

            document.getElementById('season_id').value = id;
            document.getElementById('league_id').value = leagueId;
            document.getElementById('year').value = year;

            document.getElementById('submit-button').innerText = 'Update Season';
            document.getElementById('form-title').innerText = 'Edit Season';
        });
    });

    
</script>
{% endblock %}
