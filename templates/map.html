{% extends "layout.html" %}
{% block title %}Global Interactive Map - Sports League Management{% endblock %}
{% block content %}

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

<style>
    #globalMap {
        height: 600px;
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .map-controls {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }

    .league-marker {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .map-legend {
        background: white;
        padding: 10px 14px;
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.25);
        font-size: 14px;
        line-height: 24px;
    }

    .map-legend i {
        width: 14px;
        height: 14px;
        display: inline-block;
        margin-right: 6px;
        border-radius: 50%;
    }
</style>

<div class="container mt-4">
    <h1 class="mb-4"><i class="fa fa-globe"></i> Global Stadiums Map</h1>
    
    <div class="map-controls row">
        <div class="col-md-4">
            <label for="leagueFilter">Filter by League:</label>
            <select id="leagueFilter" class="form-control">
                <option value="">All Leagues</option>
                {% for league in leagues %}
                    <option value="{{ league[0] }}">{{ league[1] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <label for="countryFilter">Filter by Country:</label>
            <select id="countryFilter" class="form-control">
                <option value="">All Countries</option>
                {% for country in countries %}
                    <option value="{{ country[0] }}">{{ country[0] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-3">
            <label for="cityFilter">Filter by City:</label>
            <select id="cityFilter" class="form-control">
                <option value="">All Cities</option>
                {% for city in cities %}
                    <option value="{{ city[0] }}">{{ city[0] }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="col-md-2 d-flex align-items-end">
            <button id="applyFilters" class="btn btn-primary w-100">
                <i class="fa fa-filter"></i> Apply
            </button>
        </div>
    </div>

    <div id="globalMap"></div>

    <div id="leagueLegendData" style="display: none;">
    {% for league in leagues %}
        <span
            class="league-legend-item"
            data-name="{{ league[1] }}"
            data-color="{{ league[2] or '#343a40' }}">
        </span>
    {% endfor %}
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const map = L.map('globalMap').setView([48.8566, 2.3522], 4);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const markers = L.markerClusterGroup({
            showCoverageOnHover: true,
            zoomToBoundsOnClick: true,
            spiderfyOnMaxZoom: true,
            disableClusteringAtZoom: 18,
            maxClusterRadius: 150
        });

        map.addLayer(markers);



        function createLeagueIcon(leagueColor) {
    const color = leagueColor || '#343a40';

    return L.divIcon({
        className: '',
        html: `<div class="league-marker" style="background-color: ${color};"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -9]
    });
}

        function loadStadiums() {
            const leagueId = document.getElementById('leagueFilter').value;
            const country = document.getElementById('countryFilter').value;
            const city = document.getElementById('cityFilter').value;
            
            let url = '/api/stadiums/geojson?';

            if (leagueId) {
                url += `league_id=${leagueId}&`;
            }

            if (country) {
                url += `country=${encodeURIComponent(country)}&`;
            }

            if (city) {
                url += `city=${encodeURIComponent(city)}`;
            }

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    markers.clearLayers();

                    const bounds = [];

                    data.features.forEach(feature => {
                        const props = feature.properties;
                        const lng = feature.geometry.coordinates[0];
                        const lat = feature.geometry.coordinates[1];

                        const marker = L.marker([lat, lng], {
    icon: createLeagueIcon(props.league_color)
});

                        const popupContent = `
                            <div>
                                <h5 class="mb-1">${props.name}</h5>
                                <p class="mb-1 text-muted">
                                    <i class="fa fa-map-marker-alt"></i> ${props.city || 'N/A'}, ${props.country || 'N/A'}
                                </p>
                                <hr class="my-2">
                                <p class="mb-1"><strong>Home Team:</strong> ${props.team_name ? `<a href="/team/${props.team_id || ''}">${props.team_name}</a>` : 'N/A'}</p>
                                <p class="mb-1"><strong>League:</strong> ${props.league_name || 'N/A'}</p>
                                <p class="mb-1"><strong>Capacity:</strong> ${props.capacity ? Number(props.capacity).toLocaleString() : 'N/A'}</p>
                                <p class="mb-0"><strong>Coordinates:</strong> ${lat}, ${lng}</p>
                            </div>
                        `;

                        marker.bindPopup(popupContent);

                        markers.addLayer(marker);
                        bounds.push([lat, lng]);
                    });

                    if (bounds.length > 0) {
                        map.fitBounds(bounds, {
                            padding: [50, 50],
                            maxZoom: 5
                        });
                    }
                })
                .catch(error => console.error('Error loading stadiums:', error));
        }

        const legend = L.control({ position: 'bottomright' });

legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'map-legend');

    div.innerHTML = '<strong>Leagues</strong><br>';

    const leagueItems = document.querySelectorAll('#leagueLegendData .league-legend-item');

    leagueItems.forEach(function(item) {
        const name = item.dataset.name;
        const color = item.dataset.color || '#343a40';

        div.innerHTML += `
            <span>
                <i style="background-color: ${color};"></i>
                ${name}
            </span><br>
        `;
    });

    return div;
};

legend.addTo(map);

        loadStadiums();

        document.getElementById('applyFilters').addEventListener('click', loadStadiums);
    });
</script>
{% endblock %}
