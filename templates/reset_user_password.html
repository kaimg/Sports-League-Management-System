{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
  <h1>Reset Password for "{{ username }}"</h1>

  <form method="POST">
    <label for="new_password">New Password:</label>
    <input type="password" name="new_password" id="new_password" required class="form-control mb-3">

    <button type="submit" class="btn btn-danger">Reset Password</button>
    <a href="{{ url_for('admin.manage_players') }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
