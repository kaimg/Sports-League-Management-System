{% extends "layout.html" %}
{% block title %}Stadiums Map{% endblock %}

{% block content %}

<div class="container mt-4">
    <h1 class="mb-4">Stadiums Map</h1>

    <div class="row mb-3">
        <div class="col-md-3">
            <input type="text" id="cityFilter" class="form-control" placeholder="Filter by city">
        </div>
        <div class="col-md-3">
            <input type="text" id="countryFilter" class="form-control" placeholder="Filter by country">
        </div>
        <div class="col-md-3">
            <input type="number" id="leagueFilter" class="form-control" placeholder="League ID">
        </div>
        <div class="col-md-3">
            <button class="btn btn-primary w-100" onclick="loadStadiums()">Filter</button>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="number" step="any" id="nearLat" class="form-control" placeholder="Latitude">
        </div>
        <div class="col-md-4">
            <input type="number" step="any" id="nearLon" class="form-control" placeholder="Longitude">
        </div>
        <div class="col-md-2">
            <input type="number" id="radiusKm" class="form-control" placeholder="Radius km">
        </div>
        <div class="col-md-2">
            <button class="btn btn-success w-100" onclick="findNearbyStadiums()">Nearby</button>
        </div>
    </div>

    <div id="map" style="height: 600px; width: 100%; border-radius: 10px;"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css">
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<style>
    .league-marker {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.5);
    }

    .league-premier {
        background-color: #007bff;
    }

    .league-laliga {
        background-color: #dc3545;
    }

    .league-bundesliga {
        background-color: #ffc107;
    }

    .league-seriea {
        background-color: #28a745;
    }

    .league-ligue1 {
        background-color: #6f42c1;
    }

    .league-default {
        background-color: #343a40;
    }
</style>
<script>
    
    

    const map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let markers = L.markerClusterGroup();
map.addLayer(markers);
let radiusCircle = null;

    function clearMap() {
    markers.clearLayers();

    if (radiusCircle) {
        map.removeLayer(radiusCircle);
        radiusCircle = null;
    }
}

function getLeagueClass(leagueName) {
    if (!leagueName) {
        return 'league-default';
    }

    const league = leagueName.toLowerCase();

    if (league.includes('premier')) {
        return 'league-premier';
    }

    if (league.includes('liga')) {
        return 'league-laliga';
    }

    if (league.includes('bundesliga')) {
        return 'league-bundesliga';
    }

    if (league.includes('serie')) {
        return 'league-seriea';
    }

    if (league.includes('ligue')) {
        return 'league-ligue1';
    }

    return 'league-default';
}

function createLeagueIcon(leagueName) {
    return L.divIcon({
        className: '',
        html: `<div class="league-marker ${getLeagueClass(leagueName)}"></div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
        popupAnchor: [0, -9]
    });
}

    function addStadiumMarkers(stadiums) {
        const bounds = [];

        stadiums.forEach(stadium => {
            const marker = L.marker([stadium.latitude, stadium.longitude], {
    icon: createLeagueIcon(stadium.league_name)
})
                .addTo(map)
                .bindPopup(`
    <strong>${stadium.name}</strong><br>
    Team: ${stadium.team_name || 'N/A'}<br>
    League: ${stadium.league_name || 'N/A'}<br>
    ${stadium.city || 'N/A'}, ${stadium.country || 'N/A'}<br>
    Location: ${stadium.location || 'N/A'}<br>
    Capacity: ${stadium.capacity || 'N/A'}<br>
    Lat: ${stadium.latitude}<br>
    Lon: ${stadium.longitude}
`);

            markers.addLayer(marker);
            bounds.push([stadium.latitude, stadium.longitude]);
        });

        if (bounds.length > 0) {
            map.fitBounds(bounds);
        }
    }

    function loadStadiums() {
        clearMap();

        const city = document.getElementById('cityFilter').value;
        const country = document.getElementById('countryFilter').value;
        const leagueId = document.getElementById('leagueFilter').value;

        fetch(`/api/stadiums?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}&league_id=${encodeURIComponent(leagueId)}`)
            .then(response => response.json())
            .then(stadiums => {
                addStadiumMarkers(stadiums);
            });
    }

    function findNearbyStadiums() {
        clearMap();

        const lat = document.getElementById('nearLat').value;
        const lon = document.getElementById('nearLon').value;
        const radius = document.getElementById('radiusKm').value || 50;

        if (!lat || !lon) {
            alert('Please enter latitude and longitude');
            return;
        }

        fetch(`/api/stadiums/nearby?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&radius=${encodeURIComponent(radius)}`)
            .then(response => response.json())
            .then(stadiums => {
                addStadiumMarkers(stadiums);

                radiusCircle = L.circle([lat, lon], {
                    color: 'green',
                    fillColor: '#5cb85c',
                    fillOpacity: 0.2,
                    radius: radius * 1000
                }).addTo(map);

                map.setView([lat, lon], 9);
            });
    }

    loadStadiums();
</script>
{% endblock %}
