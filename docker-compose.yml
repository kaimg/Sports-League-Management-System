version: '3.8'

services:
  web:
    build: .
    working_dir: /app
    ports:
      - "8888:5000"  # Changed from 5000 to avoid macOS/AirPlay conflicts
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sports_network

  db:
    image: postgres:16.2
    volumes:
      - postgres_data:/var/lib/postgresql/data

      # Optional init scripts (safe to keep, won't rerun unless volume is reset)
      - ./0-schema.sql:/docker-entrypoint-initdb.d/0-schema.sql
      - ./1-init-admin.sh:/docker-entrypoint-initdb.d/1-init-admin.sh

    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - sports_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  sports_network:
    driver: bridge

